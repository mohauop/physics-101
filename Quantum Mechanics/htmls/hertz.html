<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hertz's Discovery Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        canvas {
            background-color: #050505;
            border: 2px solid #333;
            border-radius: 8px;
            margin-top: 15px;
        }
        p { color: #aaaaaa; }
    </style>
</head>
<body>

    <h2>Hertz's Spark-Gap Experiment</h2>
    <p>Accelerating charges in the transmitter generate EM waves that induce a current in the receiver.</p>

    <canvas id="hertzCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('hertzCanvas');
        const ctx = canvas.getContext('2d');
        
        let time = 0;
        let waves = [];

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const txX = 150; // Transmitter X
            const rxX = 650; // Receiver X
            const centerY = 200;
            const antennaHeight = 80;
            
            // Oscillator properties
            const frequency = 0.1;
            const chargeY = centerY + Math.sin(time * frequency) * (antennaHeight - 10);
            
            // Generate new wave fronts at the peaks of oscillation
            if (Math.abs(Math.sin(time * frequency)) > 0.98 && time % 5 === 0) {
                waves.push({ radius: 0, alpha: 1 });
            }

            // Draw and update expanding waves
            waves.forEach((wave, index) => {
                wave.radius += 3; // Speed of the wave
                wave.alpha -= 0.003; // Fade over distance
                
                if (wave.alpha <= 0) {
                    waves.splice(index, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(txX, centerY, wave.radius, -Math.PI/2.5, Math.PI/2.5);
                    ctx.strokeStyle = `rgba(255, 150, 50, ${wave.alpha})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // --- Draw Transmitter ---
            ctx.fillStyle = '#888';
            ctx.fillRect(txX - 5, centerY - antennaHeight, 10, antennaHeight * 2);
            // Draw oscillating charge
            ctx.beginPath();
            ctx.arc(txX, chargeY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4444';
            ctx.fill();

            // --- Draw Receiver ---
            ctx.fillStyle = '#888';
            ctx.fillRect(rxX - 5, centerY - antennaHeight, 10, antennaHeight * 2);
            
            // Calculate induced charge movement in receiver (delayed and weaker)
            // The receiver picks up the oscillating wave
            const distance = rxX - txX;
            const waveDelay = distance / 3; 
            const inducedY = centerY + Math.sin((time - waveDelay) * frequency) * (antennaHeight * 0.4);
            
            // Draw induced charge
            ctx.beginPath();
            ctx.arc(rxX, inducedY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#44aaff';
            ctx.fill();

            // Labels
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText("Transmitter", txX - 40, centerY + antennaHeight + 30);
            ctx.fillText("Receiver", rxX - 35, centerY + antennaHeight + 30);

            time++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
