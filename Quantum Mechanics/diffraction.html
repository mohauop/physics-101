<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Slit Interference Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        canvas {
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        p { color: #aaaaaa; }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 30px;
            background: #1e1e1e;
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <h2>Multi-Slit (Diffraction Grating) Interference</h2>
    <p>Add more slits to see the interference peaks become sharper and more defined.</p>

    <canvas id="slitCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <div class="control-group">
            <label for="numSlits">Number of Slits</label>
            <input type="range" id="numSlits" min="1" max="6" value="2">
        </div>
        <div class="control-group">
            <label for="slitDistance">Slit Separation Distance</label>
            <input type="range" id="slitDistance" min="20" max="80" value="40">
        </div>
        <div class="control-group">
            <label for="wavelength">Wavelength</label>
            <input type="range" id="wavelength" min="10" max="40" value="20">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('slitCanvas');
        const ctx = canvas.getContext('2d');
        
        const numSlitsSlider = document.getElementById('numSlits');
        const slitDistanceSlider = document.getElementById('slitDistance');
        const wavelengthSlider = document.getElementById('wavelength');
        
        let time = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const numSlits = parseInt(numSlitsSlider.value);
            const slitD = parseInt(slitDistanceSlider.value);
            const waveL = parseInt(wavelengthSlider.value);
            
            const barrierX = 150;
            const screenX = 700;
            const centerY = canvas.height / 2;
            
            // Calculate slit positions
            const slits = [];
            const totalHeight = (numSlits - 1) * slitD;
            const startY = centerY - totalHeight / 2;
            for(let i = 0; i < numSlits; i++) {
                slits.push(startY + i * slitD);
            }

            // 1. Draw expanding wave rings from each slit
            ctx.lineWidth = 1.0;
            for (let r = (time % waveL); r < screenX - barrierX; r += waveL) {
                slits.forEach(slitY => {
                    ctx.beginPath();
                    ctx.arc(barrierX, slitY, r, -Math.PI/2.5, Math.PI/2.5);
                    ctx.strokeStyle = `rgba(100, 255, 150, ${Math.max(0, 0.8 - r/500)})`;
                    ctx.stroke();
                });
            }

            // 2. Draw Barrier with gaps for slits
            ctx.fillStyle = '#888';
            if (slits.length > 0) {
                ctx.fillRect(barrierX - 5, 0, 10, slits[0] - 10); // Top wall
                for (let i = 0; i < slits.length - 1; i++) {
                    ctx.fillRect(barrierX - 5, slits[i] + 10, 10, slits[i+1] - slits[i] - 20); // Middle walls
                }
                ctx.fillRect(barrierX - 5, slits[slits.length - 1] + 10, 10, canvas.height - slits[slits.length - 1] - 10); // Bottom wall
            }

            // 3. Calculate and Draw the Intensity Pattern on the Screen
            ctx.fillStyle = '#222';
            ctx.fillRect(screenX, 0, 100, canvas.height); 
            
            ctx.beginPath();
            ctx.moveTo(screenX, 0);
            
            for (let y = 0; y < canvas.height; y++) {
                let sumCos = 0;
                let sumSin = 0;
                
                // Add the instantaneous amplitude for all waves at this point on the screen
                for(let i = 0; i < numSlits; i++) {
                    const d = Math.sqrt(Math.pow(screenX - barrierX, 2) + Math.pow(y - slits[i], 2));
                    const phase = (2 * Math.PI * d) / waveL;
                    sumCos += Math.cos(phase);
                    sumSin += Math.sin(phase);
                }
                
                // Square the combined amplitude to get intensity and normalize it
                const maxIntensity = numSlits * numSlits;
                const intensity = (sumCos * sumCos + sumSin * sumSin) / maxIntensity;
                
                const graphX = screenX + intensity * 80;
                ctx.lineTo(graphX, y);
            }
            
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.lineTo(screenX, canvas.height);
            ctx.lineTo(screenX, 0);
            ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
            ctx.fill();

            // Labels
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText("Barrier", barrierX - 25, 20);
            ctx.fillText("Screen Intensity", screenX - 10, 20);

            time += 0.5;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
